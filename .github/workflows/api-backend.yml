name: Bun Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
     


jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
           working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

        env:
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          RATE_LIMIT_REGISTER: 5   
          RATE_LIMIT_LOGIN: 10      
          RATE_LIMIT_REDIRECT: 60

    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest

        - name: Install dependencies
          run: bun install --frozen-lockfile

        - name: Type check
          run: bun tsc --noEmit

        - name: Run tests
          run: bun test --coverage
