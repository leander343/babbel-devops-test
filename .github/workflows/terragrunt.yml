name: Terragrunt Stack Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'

  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
      confirm_destroy:
        description: "Type 'destroy' to confirm destruction"
        required: false
        type: string


permissions:
  id-token: write   # required for OIDC
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.10.0"
  TG_VERSION: "1.0.0"
  AWS_REGION: ${{secrets.REGION}}
  STACK_DIR: "infra/dev"


jobs:
  terragrunt:
    name: Terragrunt ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}
    runs-on: ubuntu-latest
    defaults:
      run:
           working-directory: ${{ env.STACK_DIR }}  # path to your terragrunt.stack.hcl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.0        
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        run: |
          wget -q https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version
      

      - name: Terragrunt Plan
        id: plan
        run: |
          terragrunt stack run plan \
            -- --out=tfplan \
            2>&1 | tee ${{ runner.temp }}/plan_output.txt
        continue-on-error: true

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT_PATH: ${{ runner.temp }}/plan_output.txt
        with:
          script: |
            const fs = require('fs');
            // Read and strip ANSI color codes
            let output = fs.readFileSync(process.env.PLAN_OUTPUT_PATH, 'utf8');
            output = output.replace(/\x1B\[[0-9;]*[mGKHF]/g, '');

            const truncated = output.length > 60000
              ? output.substring(0, 60000) + '\n\n... output truncated, check Actions logs for full output ...'
              : output;

            const body = [
              `<details>`,
              `<summary> Full plan output</summary>`,
              ``,
              `\`\`\``,
              truncated,
              `\`\`\``,
              `</details>`,
              ``,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terragrunt Plan\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Fail if Plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terragrunt Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: |
          terragrunt stack --non-interactive run apply \



      - name: Confirm Destroy Guard
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "destroy" ]; then
            echo "Destroy not confirmed. Type 'destroy' in the confirm_destroy input."
            exit 1
          fi

      - name: Terragrunt Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: |
          terragrunt stack --non-interactive run destroy 
